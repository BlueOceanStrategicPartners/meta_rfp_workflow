name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospitality-rfp-engine/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local_sqlite
          USE_FIXTURE_DEBATE: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
      - run: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local_sqlite
          USE_FIXTURE_DEBATE: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospitality-rfp-engine/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
